{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
     <!-- Main css -->
    <link rel="stylesheet" href="../static/adindesk.css">
    <title>Admin Dashboard - Shoe Hub</title>
   
</head>


<body>
<div class="main">

    <div class="main-left">

        <div class="title-img">
            <img src="{% static 'image/logo/Logo2.png' %}" alt="">
        </div>
        <div class="heding-1">
            <a href="{%url 'admindesk'%}"><h2>Deshboard</h2></a>
            <a href="{%url 'adminuser'%}"><h2>User</h2></a>
            <a href="{%url 'adminproduct'%}"><h2>Product</h2></a>
            <a href="{%url 'adminorder'%}"><h2>Order</h2></a>
        </div>

    </div>

    <div class="main-right">

        <div class="totle-sel">
            <div class="ts1">
                <h2>Totle Sales</h2>
                <p>₹{{data}}</p>
            </div>
            <div class="ts1">
                <h2>Product</h2>
                <p>{{data1}}</p>
            </div>
            <div class="ts1">
                <h2>Order</h2>
                <p>{{data2}}</p>
            </div>
            <div class="ts1">
                <h2>User</h2>
                <p>{{data3}}</p>
            </div>
            
        </div>

        <div class="resent-ord">

            <div class="resent-tit">
                <h2>Recent Orders</h2>
            </div>

            <div class="ord-detail">
               <table>
                    <tr>
                        <th><h2>Order Id</h2></th>
                        <th><h2>Image</h2></th>
                        <th><h2>Name</h2></th>
                        <th><h2>Date</h2></th>
                        <!-- <th><h2>status</h2></th> -->
                        <th><h2>Price</h2></th>
                    </tr>
                {% for i in data4 %}
                    <tr>
                        <td>{{i.oid}}</td>
                        <td><img src="../static/image/detail/{{i.image}}" alt=""></td>
                        <td>{{i.name}}</td>
                        <td>{{i.date}}</td>
                        <!-- <td>Deleverd</td> -->
                        <td>₹{{i.price}}</td>
                    </tr>
                {% endfor %}
                </table>
            </div>
            <div class="see">
                <a href="{%url 'adminorder'%}">See More</a>
            </div>
            
        </div>
       


    </div>
</div>

</body>
</html>
